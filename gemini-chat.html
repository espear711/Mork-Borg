<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red-dark: #8b1a1a;
      --red-mid: #b22222;
      --red-accent: #dc3545;
      --red-light: #e74c5a;
      --gray-darkest: #1a1a1a;
      --gray-dark: #2a2a2a;
      --gray-mid: #3a3a3a;
      --gray-light: #555;
      --gray-lighter: #888;
      --gray-text: #ccc;
      --gray-bright: #e0e0e0;
      --white: #f0f0f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--gray-darkest);
      color: var(--gray-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--gray-dark);
      border-right: 2px solid var(--red-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--gray-mid);
    }

    .sidebar-header h2 {
      color: var(--red-accent);
      font-size: 1.1rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: var(--red-dark);
      color: var(--white);
      border: 1px solid var(--red-mid);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--red-mid); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 3px; }

    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
      font-size: 0.85rem;
      color: var(--gray-text);
    }
    .chat-item:hover { background: var(--gray-mid); }
    .chat-item.active { background: var(--red-dark); color: var(--white); }

    .chat-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-delete {
      background: none;
      border: none;
      color: var(--gray-lighter);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .chat-item:hover .chat-item-delete { opacity: 1; }
    .chat-item-delete:hover { color: var(--red-light); }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── API Key Bar ── */
    .api-bar {
      padding: 12px 20px;
      background: var(--gray-dark);
      border-bottom: 1px solid var(--gray-mid);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .api-bar label {
      font-size: 0.85rem;
      color: var(--gray-lighter);
      white-space: nowrap;
    }

    .api-bar input {
      flex: 1;
      padding: 8px 12px;
      background: var(--gray-darkest);
      border: 1px solid var(--gray-light);
      border-radius: 6px;
      color: var(--gray-bright);
      font-size: 0.85rem;
      font-family: monospace;
    }
    .api-bar input:focus { outline: none; border-color: var(--red-accent); }

    .api-bar button {
      padding: 8px 16px;
      background: var(--red-dark);
      color: var(--white);
      border: 1px solid var(--red-mid);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .api-bar button:hover { background: var(--red-mid); }

    .api-status {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .api-status.connected { background: #1a3a1a; color: #4caf50; }
    .api-status.disconnected { background: #3a1a1a; color: var(--red-light); }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 4px; }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--red-dark);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--gray-mid);
      color: var(--gray-bright);
      border-bottom-left-radius: 4px;
      border-left: 3px solid var(--red-accent);
    }

    .message.error {
      align-self: center;
      background: #3a1a1a;
      color: var(--red-light);
      border: 1px solid var(--red-dark);
      font-size: 0.85rem;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--gray-lighter);
      text-align: center;
      padding: 40px;
    }
    .welcome h1 { color: var(--red-accent); font-size: 1.8rem; margin-bottom: 8px; }
    .welcome p { font-size: 0.95rem; max-width: 450px; line-height: 1.5; }

    .typing-indicator {
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--gray-mid);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      border-left: 3px solid var(--red-accent);
      display: none;
    }
    .typing-indicator span {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--gray-lighter);
      border-radius: 50%;
      margin-right: 4px;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input Bar ── */
    .input-bar {
      padding: 16px 20px;
      background: var(--gray-dark);
      border-top: 1px solid var(--gray-mid);
      display: flex;
      gap: 10px;
    }

    .input-bar textarea {
      flex: 1;
      padding: 12px 14px;
      background: var(--gray-darkest);
      border: 1px solid var(--gray-light);
      border-radius: 10px;
      color: var(--gray-bright);
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      min-height: 46px;
      max-height: 150px;
      line-height: 1.4;
    }
    .input-bar textarea:focus { outline: none; border-color: var(--red-accent); }

    .send-btn {
      padding: 0 20px;
      background: var(--red-mid);
      color: var(--white);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
      transition: background 0.2s;
      align-self: flex-end;
      height: 46px;
    }
    .send-btn:hover { background: var(--red-accent); }
    .send-btn:disabled { background: var(--gray-light); cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Gemini Chat</h2>
      <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- API Key Bar -->
    <div class="api-bar">
      <label for="apiKeyInput">API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Enter your Gemini API key">
      <button onclick="saveApiKey()">Save Key</button>
      <span class="api-status disconnected" id="apiStatus">No key</span>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>Gemini Chat</h1>
        <p>Enter your Gemini API key above, then start a conversation with Gemini Flash Lite.</p>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <textarea id="userInput" placeholder="Type your message..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  // ─── Storage namespace (scoped to this file's path) ───
  const STORAGE_PREFIX = 'gemini_chat_' + window.location.pathname + '_';

  function storageKey(k) { return STORAGE_PREFIX + k; }

  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(storageKey(key))) || fallback; }
    catch { return fallback; }
  }
  function saveJSON(key, val) { localStorage.setItem(storageKey(key), JSON.stringify(val)); }

  // ─── State ───
  let chats = loadJSON('chats', {});        // { id: { title, messages: [{role,text}] } }
  let activeChatId = loadJSON('activeChat', null);
  let apiKey = localStorage.getItem(storageKey('apiKey')) || '';

  const MODEL = 'gemini-2.0-flash-lite';

  // ─── Init ───
  if (apiKey) {
    document.getElementById('apiKeyInput').value = apiKey;
    setApiStatus(true);
  }
  renderChatList();
  renderMessages();

  // ─── API Key ───
  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val) return;
    apiKey = val;
    localStorage.setItem(storageKey('apiKey'), apiKey);
    setApiStatus(true);
  }

  function setApiStatus(connected) {
    const el = document.getElementById('apiStatus');
    if (connected) {
      el.textContent = 'Key saved';
      el.className = 'api-status connected';
    } else {
      el.textContent = 'No key';
      el.className = 'api-status disconnected';
    }
  }

  // ─── Chat Management ───
  function newChat() {
    const id = 'chat_' + Date.now();
    chats[id] = { title: 'New Chat', messages: [] };
    activeChatId = id;
    persist();
    renderChatList();
    renderMessages();
    document.getElementById('userInput').focus();
  }

  function switchChat(id) {
    activeChatId = id;
    saveJSON('activeChat', activeChatId);
    renderChatList();
    renderMessages();
  }

  function deleteChat(id, ev) {
    ev.stopPropagation();
    delete chats[id];
    if (activeChatId === id) activeChatId = Object.keys(chats)[0] || null;
    persist();
    renderChatList();
    renderMessages();
  }

  function persist() {
    saveJSON('chats', chats);
    saveJSON('activeChat', activeChatId);
  }

  // ─── Rendering ───
  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    const ids = Object.keys(chats).reverse();
    for (const id of ids) {
      const chat = chats[id];
      const div = document.createElement('div');
      div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
      div.innerHTML = `
        <span class="chat-item-title">${escapeHtml(chat.title)}</span>
        <button class="chat-item-delete" onclick="deleteChat('${id}', event)" title="Delete">&times;</button>
      `;
      div.addEventListener('click', () => switchChat(id));
      list.appendChild(div);
    }
  }

  function renderMessages() {
    const container = document.getElementById('messages');
    container.innerHTML = '';

    if (!activeChatId || !chats[activeChatId]) {
      container.innerHTML = `
        <div class="welcome">
          <h1>Gemini Chat</h1>
          <p>Enter your Gemini API key above, then start a conversation with Gemini Flash Lite.</p>
        </div>`;
      return;
    }

    const msgs = chats[activeChatId].messages;
    if (msgs.length === 0) {
      container.innerHTML = `
        <div class="welcome">
          <h1>Start chatting</h1>
          <p>Type a message below to begin your conversation.</p>
        </div>`;
      return;
    }

    for (const msg of msgs) {
      const div = document.createElement('div');
      div.className = 'message ' + msg.role;
      div.textContent = msg.text;
      container.appendChild(div);
    }

    container.scrollTop = container.scrollHeight;
  }

  // ─── Send Message ───
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    if (!apiKey) {
      alert('Please enter and save your Gemini API key first.');
      return;
    }

    // Auto-create a chat if none active
    if (!activeChatId || !chats[activeChatId]) {
      newChat();
    }

    const chat = chats[activeChatId];

    // Add user message
    chat.messages.push({ role: 'user', text });
    // Auto-title from first message
    if (chat.messages.length === 1) {
      chat.title = text.length > 40 ? text.substring(0, 40) + '...' : text;
    }
    persist();
    renderChatList();
    renderMessages();

    input.value = '';
    autoResize(input);

    // Show typing indicator & disable send
    const typing = document.getElementById('typingIndicator');
    const sendBtn = document.getElementById('sendBtn');
    typing.style.display = 'block';
    sendBtn.disabled = true;

    try {
      const replyText = await callGemini(chat.messages);
      chat.messages.push({ role: 'assistant', text: replyText });
    } catch (err) {
      chat.messages.push({ role: 'error', text: 'Error: ' + err.message });
    }

    persist();
    typing.style.display = 'none';
    sendBtn.disabled = false;
    renderMessages();
    document.getElementById('userInput').focus();
  }

  // ─── Gemini API Call ───
  async function callGemini(messages) {
    // Build the contents array for the Gemini API
    const contents = messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents })
    });

    if (!res.ok) {
      const errBody = await res.text();
      let detail = '';
      try { detail = JSON.parse(errBody).error.message; } catch { detail = errBody; }
      throw new Error(`API ${res.status}: ${detail}`);
    }

    const data = await res.json();
    const candidate = data.candidates && data.candidates[0];
    if (!candidate || !candidate.content || !candidate.content.parts) {
      throw new Error('No response from model.');
    }

    return candidate.content.parts.map(p => p.text).join('');
  }

  // ─── Helpers ───
  function handleKey(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>

</body>
</html>
