<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red-dark: #8b1a1a;
      --red-mid: #b22222;
      --red-accent: #dc3545;
      --red-light: #e74c5a;
      --gray-darkest: #1a1a1a;
      --gray-dark: #2a2a2a;
      --gray-mid: #3a3a3a;
      --gray-light: #555;
      --gray-lighter: #888;
      --gray-text: #ccc;
      --gray-bright: #e0e0e0;
      --white: #f0f0f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--gray-darkest);
      color: var(--gray-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Tab Bar (icon strip) ── */
    .tab-bar {
      width: 48px;
      min-width: 48px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      gap: 8px;
      height: 100vh;
      z-index: 10;
    }

    .tab-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: var(--gray-mid);
      color: var(--gray-lighter);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn:hover { background: var(--gray-light); color: var(--gray-bright); }
    .tab-btn.active { background: var(--red-mid); color: var(--white); }

    .tab-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ── Side Panel (slides out) ── */
    .side-panel {
      width: 0;
      overflow: hidden;
      background: var(--gray-dark);
      border-right: 2px solid var(--red-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: width 0.25s ease;
    }
    .side-panel.open {
      width: 280px;
      min-width: 280px;
    }

    .panel-content {
      display: none;
      flex-direction: column;
      height: 100%;
      min-width: 280px;
    }
    .panel-content.active {
      display: flex;
    }

    /* ── Chat panel ── */
    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--gray-mid);
    }

    .sidebar-header h2 {
      color: var(--red-accent);
      font-size: 1.1rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px;
      background: var(--red-dark);
      color: var(--white);
      border: 1px solid var(--red-mid);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--red-mid); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 3px; }

    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
      font-size: 0.85rem;
      color: var(--gray-text);
    }
    .chat-item:hover { background: var(--gray-mid); }
    .chat-item.active { background: var(--red-dark); color: var(--white); }

    .chat-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-delete {
      background: none;
      border: none;
      color: var(--gray-lighter);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .chat-item:hover .chat-item-delete { opacity: 1; }
    .chat-item-delete:hover { color: var(--red-light); }

    /* ── Lore panel (placeholder) ── */
    .panel-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-lighter);
      font-size: 0.95rem;
      padding: 20px;
      text-align: center;
    }

    /* ── Main Panel ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Settings panel ── */
    .settings-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-label {
      font-size: 0.8rem;
      color: var(--gray-lighter);
      margin-bottom: 4px;
    }

    .settings-body input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      background: var(--gray-darkest);
      border: 1px solid var(--gray-light);
      border-radius: 6px;
      color: var(--gray-bright);
      font-size: 0.85rem;
      font-family: monospace;
    }
    .settings-body input[type="password"]:focus { outline: none; border-color: var(--red-accent); }

    .settings-body button {
      width: 100%;
      padding: 9px;
      background: var(--red-dark);
      color: var(--white);
      border: 1px solid var(--red-mid);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .settings-body button:hover { background: var(--red-mid); }

    .api-status {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 10px;
      text-align: center;
    }
    .api-status.connected { background: #1a3a1a; color: #4caf50; }
    .api-status.disconnected { background: #3a1a1a; color: var(--red-light); }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--gray-light); border-radius: 4px; }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--red-dark);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--gray-mid);
      color: var(--gray-bright);
      border-bottom-left-radius: 4px;
      border-left: 3px solid var(--red-accent);
    }

    .message.error {
      align-self: center;
      background: #3a1a1a;
      color: var(--red-light);
      border: 1px solid var(--red-dark);
      font-size: 0.85rem;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--gray-lighter);
      text-align: center;
      padding: 40px;
    }
    .welcome h1 { color: var(--red-accent); font-size: 1.8rem; margin-bottom: 8px; }
    .welcome p { font-size: 0.95rem; max-width: 450px; line-height: 1.5; }

    .typing-indicator {
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--gray-mid);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      border-left: 3px solid var(--red-accent);
      display: none;
    }
    .typing-indicator span {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--gray-lighter);
      border-radius: 50%;
      margin-right: 4px;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input Bar ── */
    .input-bar {
      padding: 16px 20px;
      background: var(--gray-dark);
      border-top: 1px solid var(--gray-mid);
      display: flex;
      gap: 10px;
    }

    .input-bar textarea {
      flex: 1;
      padding: 12px 14px;
      background: var(--gray-darkest);
      border: 1px solid var(--gray-light);
      border-radius: 10px;
      color: var(--gray-bright);
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      min-height: 46px;
      max-height: 150px;
      line-height: 1.4;
    }
    .input-bar textarea:focus { outline: none; border-color: var(--red-accent); }

    .send-btn {
      padding: 0 20px;
      background: var(--red-mid);
      color: var(--white);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
      transition: background 0.2s;
      align-self: flex-end;
      height: 46px;
    }
    .send-btn:hover { background: var(--red-accent); }
    .send-btn:disabled { background: var(--gray-light); cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Tab Bar (icon strip) -->
  <div class="tab-bar">
    <button class="tab-btn" id="tabChat" onclick="togglePanel('chat')" title="Chats">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
    </button>
    <button class="tab-btn" id="tabLore" onclick="togglePanel('lore')" title="Lore">
      <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
    </button>
    <button class="tab-btn" id="tabCode" onclick="togglePanel('code')" title="Code">
      <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
    </button>
    <button class="tab-btn" id="tabSettings" onclick="togglePanel('settings')" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
    </button>
  </div>

  <!-- Side Panel (slides out) -->
  <div class="side-panel" id="sidePanel">
    <!-- Chat Panel -->
    <div class="panel-content" id="panelChat">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <!-- Lore Panel -->
    <div class="panel-content" id="panelLore">
      <div class="sidebar-header"><h2>Lore</h2></div>
      <div class="panel-placeholder">Coming soon...</div>
    </div>
    <!-- Code Panel -->
    <div class="panel-content" id="panelCode">
      <div class="sidebar-header"><h2>Code</h2></div>
      <div class="panel-placeholder">Coming soon...</div>
    </div>
    <!-- Settings Panel -->
    <div class="panel-content" id="panelSettings">
      <div class="sidebar-header"><h2>Settings</h2></div>
      <div class="settings-body">
        <div>
          <div class="settings-label">Gemini API Key</div>
          <input type="password" id="apiKeyInput" placeholder="Enter your Gemini API key">
        </div>
        <button onclick="saveApiKey()">Save Key</button>
        <span class="api-status disconnected" id="apiStatus">No key</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>Gemini Chat</h1>
        <p>Open Settings (gear icon) to enter your Gemini API key, then start a conversation.</p>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <textarea id="userInput" placeholder="Type your message..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  // ─── Storage namespace (scoped to this file's path) ───
  const STORAGE_PREFIX = 'gemini_chat_' + window.location.pathname + '_';

  function storageKey(k) { return STORAGE_PREFIX + k; }

  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(storageKey(key))) || fallback; }
    catch { return fallback; }
  }
  function saveJSON(key, val) { localStorage.setItem(storageKey(key), JSON.stringify(val)); }

  // ─── State ───
  let chats = loadJSON('chats', {});        // { id: { title, messages: [{role,text}] } }
  let activeChatId = loadJSON('activeChat', null);
  let apiKey = localStorage.getItem(storageKey('apiKey')) || '';

  const MODEL = 'gemini-3.1-flash-lite-preview';

  // ─── Side Panel Toggle ───
  let activePanel = null;

  function togglePanel(name) {
    const panel = document.getElementById('sidePanel');
    const panels = { chat: 'panelChat', lore: 'panelLore', code: 'panelCode', settings: 'panelSettings' };
    const tabs = { chat: 'tabChat', lore: 'tabLore', code: 'tabCode', settings: 'tabSettings' };

    // Clicking the already-active tab collapses the panel
    if (activePanel === name) {
      panel.classList.remove('open');
      document.getElementById(tabs[name]).classList.remove('active');
      document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
      activePanel = null;
      return;
    }

    // Deactivate all tabs & panels
    Object.values(tabs).forEach(id => document.getElementById(id).classList.remove('active'));
    document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));

    // Activate the selected tab & panel
    document.getElementById(tabs[name]).classList.add('active');
    document.getElementById(panels[name]).classList.add('active');
    panel.classList.add('open');
    activePanel = name;
  }

  // ─── Init ───
  if (apiKey) {
    document.getElementById('apiKeyInput').value = apiKey;
    setApiStatus(true);
  }
  renderChatList();
  renderMessages();

  // ─── API Key ───
  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val) return;
    apiKey = val;
    localStorage.setItem(storageKey('apiKey'), apiKey);
    setApiStatus(true);
  }

  function setApiStatus(connected) {
    const el = document.getElementById('apiStatus');
    if (connected) {
      el.textContent = 'Key saved';
      el.className = 'api-status connected';
    } else {
      el.textContent = 'No key';
      el.className = 'api-status disconnected';
    }
  }

  // ─── Chat Management ───
  function newChat() {
    const id = 'chat_' + Date.now();
    chats[id] = { title: 'New Chat', messages: [] };
    activeChatId = id;
    persist();
    renderChatList();
    renderMessages();
    document.getElementById('userInput').focus();
  }

  function switchChat(id) {
    activeChatId = id;
    saveJSON('activeChat', activeChatId);
    renderChatList();
    renderMessages();
  }

  function deleteChat(id, ev) {
    ev.stopPropagation();
    delete chats[id];
    if (activeChatId === id) activeChatId = Object.keys(chats)[0] || null;
    persist();
    renderChatList();
    renderMessages();
  }

  function persist() {
    saveJSON('chats', chats);
    saveJSON('activeChat', activeChatId);
  }

  // ─── Rendering ───
  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    const ids = Object.keys(chats).reverse();
    for (const id of ids) {
      const chat = chats[id];
      const div = document.createElement('div');
      div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
      div.innerHTML = `
        <span class="chat-item-title">${escapeHtml(chat.title)}</span>
        <button class="chat-item-delete" onclick="deleteChat('${id}', event)" title="Delete">&times;</button>
      `;
      div.addEventListener('click', () => switchChat(id));
      list.appendChild(div);
    }
  }

  function renderMessages() {
    const container = document.getElementById('messages');
    container.innerHTML = '';

    if (!activeChatId || !chats[activeChatId]) {
      container.innerHTML = `
        <div class="welcome">
          <h1>Gemini Chat</h1>
          <p>Open Settings (gear icon) to enter your Gemini API key, then start a conversation.</p>
        </div>`;
      return;
    }

    const msgs = chats[activeChatId].messages;
    if (msgs.length === 0) {
      container.innerHTML = `
        <div class="welcome">
          <h1>Start chatting</h1>
          <p>Type a message below to begin your conversation.</p>
        </div>`;
      return;
    }

    for (const msg of msgs) {
      const div = document.createElement('div');
      div.className = 'message ' + msg.role;
      div.textContent = msg.text;
      container.appendChild(div);
    }

    container.scrollTop = container.scrollHeight;
  }

  // ─── Send Message ───
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    if (!apiKey) {
      alert('Please enter and save your Gemini API key first.');
      return;
    }

    // Auto-create a chat if none active
    if (!activeChatId || !chats[activeChatId]) {
      newChat();
    }

    const chat = chats[activeChatId];

    // Add user message
    chat.messages.push({ role: 'user', text });
    // Auto-title from first message
    if (chat.messages.length === 1) {
      chat.title = text.length > 40 ? text.substring(0, 40) + '...' : text;
    }
    persist();
    renderChatList();
    renderMessages();

    input.value = '';
    autoResize(input);

    // Show typing indicator & disable send
    const typing = document.getElementById('typingIndicator');
    const sendBtn = document.getElementById('sendBtn');
    typing.style.display = 'block';
    sendBtn.disabled = true;

    try {
      const replyText = await callGemini(chat.messages);
      chat.messages.push({ role: 'assistant', text: replyText });
    } catch (err) {
      chat.messages.push({ role: 'error', text: 'Error: ' + err.message });
    }

    persist();
    typing.style.display = 'none';
    sendBtn.disabled = false;
    renderMessages();
    document.getElementById('userInput').focus();
  }

  // ─── Gemini API Call ───
  async function callGemini(messages) {
    // Build the contents array for the Gemini API
    const contents = messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents })
    });

    if (!res.ok) {
      const errBody = await res.text();
      let detail = '';
      try { detail = JSON.parse(errBody).error.message; } catch { detail = errBody; }
      throw new Error(`API ${res.status}: ${detail}`);
    }

    const data = await res.json();
    const candidate = data.candidates && data.candidates[0];
    if (!candidate || !candidate.content || !candidate.content.parts) {
      throw new Error('No response from model.');
    }

    return candidate.content.parts.map(p => p.text).join('');
  }

  // ─── Helpers ───
  function handleKey(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>

</body>
</html>
